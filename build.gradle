// TACZ — NeoForge 1.21.1 移植分支构建脚本
// 由 ForgeGradle 5.1 (Forge 1.20.1) 迁移到 ModDevGradle (NeoForge 1.21.1)

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "tacz-1.21.1"
}

// Mojang 自 1.20.5 起对终端用户投递 Java 21，模组应面向 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformer：修改原版成员访问修饰符
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('run/client_a')
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        }

        client2 {
            client()
            gameDirectory = project.file('run/client_b')
            programArguments.addAll '--username', 'mayday_memory'
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    // 阶段 2：逐步恢复 TACZ 的第三方依赖仓库
    // （cursemaven / latvian / blamejared / shedaniel / architectury / kosmx 等，
    //   其中 cursemaven、latvian、jitpack 在本机被代理阻断，需镜像或本地 jar 化）
}

dependencies {
    // 阶段 2：逐个补回 1.21.1 版依赖
    // 原 1.20.1 完整依赖清单见 git 历史中的 ForgeGradle 版 build.gradle
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}
