// TACZ — NeoForge 1.21.1 移植分支构建脚本
// 由 ForgeGradle 5.1 (Forge 1.20.1) 迁移到 ModDevGradle (NeoForge 1.21.1)

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "tacz-1.21.1"
}

// Mojang 自 1.20.5 起对终端用户投递 Java 21，模组应面向 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Access Transformer：修改原版成员访问修饰符
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('run/client_a')
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        }

        client2 {
            client()
            gameDirectory = project.file('run/client_b')
            programArguments.addAll '--username', 'mayday_memory'
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
        }

        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
    // 本机可直连的第三方仓库（已实测 200）
    maven { url = 'https://maven.blamejared.com' }        // JEI
    maven { url = 'https://maven.shedaniel.me/' }          // Cloth Config
    maven { url = 'https://maven.kosmx.dev/' }             // player-anim
    maven { url = 'https://maven.architectury.dev/' }      // Architectury
    maven { url = 'https://maven.neoforged.net/releases' }
    // 本地 jar（原本来自 jitpack / github-packages 的依赖，已改为源码自建）
    flatDir { dirs 'libs' }
    // 注意：cursemaven.com、maven.latvian.dev、jitpack.io 在本机被代理阻断，见下方 TODO
}

dependencies {
    // ============ 本地自建依赖 ============
    // LuaJ：原坐标 com.github.FiguraMC.luaj:luaj-{core,jse}:3.0.8-figura 走 jitpack（已阻断），
    // 现从 https://github.com/FiguraMC/luaj 的 tag 3.0.8-figura 自行编译（luaj-jse 需 BCEL 5.2）
    implementation files('libs/luaj-core-3.0.8-figura.jar')
    implementation files('libs/luaj-jse-3.0.8-figura.jar')

    // ============ Maven Central ============
    implementation("com.maydaymemory:mae:1.1.4") {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.joml', module: 'joml'
    }
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.apache.bcel:bcel:6.6.1'

    // ============ 编译期 API ============
    // JEI
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.57.0.449"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.57.0.449"
    // Cloth Config
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:15.0.128"
    // 玩家动画库
    compileOnly "dev.kosmx.player-anim:player-animation-lib-forge:2.0.4+1.21.1"

    // ============ 本地 jar 化依赖（原 maven.latvian.dev / modrinth 在本机被阻断）============
    // 版本经 mod.mcimirror.top 查询、从 cdn.modrinth.com 下载
    compileOnly files('libs/kubejs-neoforge-2101.7.0-build.131.jar')
    compileOnly files('libs/rhino-2100.2.5-build.48.jar')
    compileOnly files('libs/architectury-13.0.6-neoforge.jar')

    // ============ 本地 jar 化：CurseForge 依赖（cursemaven.com 本机被阻断）============
    // 版本经 mod.mcimirror.top 查询，从 edge.forgecdn.net 下载，全部为 1.21.1 neoforge 版
    compileOnly files('libs/controllable-neoforge-1.21.1-0.25.4.jar')
    compileOnly files('libs/embeddium-1.0.15+mc1.21.1.jar')
    compileOnly files('libs/acceleratedrendering-1.0.14-1.21.1-alpha.jar')
    implementation files('libs/framework-neoforge-1.21.1-0.13.11.jar')
    implementation files('libs/ShoulderSurfing-NeoForge-1.21.1-5.1.1.jar')
    runtimeOnly files('libs/carryon-neoforge-1.21.1-2.2.6.13.jar')

    // simplebedrockmodel：源码自建（.tools/thirdparty/simplebedrockmodel，1.21.1-2.2.x）
    implementation files('libs/simplebedrockmodel-2.2.2-neoforge-mc1.21.1.jar')

    // ============ 仍待处理 ============
    // oculus / oculus_legacy：libs 中仍是 1.20.1 版本，需换 1.21.1 后再启用
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // javac 默认只报 100 个错误就截断，提高上限以便统计真实移植规模
    options.compilerArgs.addAll '-Xmaxerrs', '20000'
    options.compilerArgs.addAll '-Xlint:-removal'
}

java {
    withSourcesJar()
}
